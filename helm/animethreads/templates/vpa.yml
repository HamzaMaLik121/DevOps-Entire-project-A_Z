{{- if and .Values.autoscaling.vpa.enabled (.Capabilities.APIVersions.Has "autoscaling.k8s.io/v1/VerticalPodAutoscaler") }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  updatePolicy:
    {{- if and $.Values.autoscaling.hpa.enabled $svc.hpa }}
    updateMode: "Off"   # HPA already scales on CPU/memory; VPA only recommends
    {{- else }}
    updateMode: {{ $.Values.autoscaling.vpa.updateMode | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: postgres
  updatePolicy:
    updateMode: "Off"
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redis
  updatePolicy:
    updateMode: "Off"
{{- end }}
{{- end }}
