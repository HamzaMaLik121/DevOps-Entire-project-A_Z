{{- if .Values.limitRange.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: animethreads-defaults
  namespace: {{ .Release.Namespace }}
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 25m, memory: 32Mi }
      default:        { cpu: 250m, memory: 256Mi }
{{- end }}
{{- if .Values.resourceQuota.enabled }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: animethreads-quota
  namespace: {{ .Release.Namespace }}
spec:
  hard:
    {{- toYaml .Values.resourceQuota.hard | nindent 4 }}
{{- end }}
