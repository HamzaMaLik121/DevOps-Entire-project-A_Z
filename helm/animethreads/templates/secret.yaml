{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: animethreads-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: animethreads
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  {{- range $name, $svc := .Values.services }}
  {{- if and $svc.enabled $svc.db }}
  DATABASE_URL_{{ upper $svc.db }}: {{ printf "postgresql://%s:%s@postgres:5432/%s?schema=%s" $.Values.postgres.user (urlquery $.Values.secrets.postgresPassword) $.Values.postgres.database $svc.db | quote }}
  {{- end }}
  {{- end }}
{{- end }}
