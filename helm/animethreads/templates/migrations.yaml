{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.db }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ $svc.db }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "at.labels" (dict "name" (printf "migrate-%s" $svc.db) "root" $) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "at.selectorLabels" (dict "name" (printf "migrate-%s" $svc.db) "root" $) | nindent 8 }}
    spec:
      restartPolicy: OnFailure

      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- include "at.scheduling" (dict "root" $ "svc" $svc "name" (printf "migrate-%s" $svc.db)) | nindent 6 }}

      initContainers:
        {{- include "at.waitFor" (list "postgres:5432") | nindent 8 }}

      containers:
        - name: migrate
          image: {{ $.Values.global.imageRegistry }}/animethreads-migrate-{{ $svc.db }}:{{ $.Values.global.imageTag }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "at.secretName" $ }}
                  key: DATABASE_URL_{{ upper $svc.db }}

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
{{- end }}
{{- end }}
