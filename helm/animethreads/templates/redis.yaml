{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "at.labels" (dict "name" "redis" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "at.selectorLabels" (dict "name" "redis" "root" $) | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "at.labels" (dict "name" "redis" "root" $) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "at.selectorLabels" (dict "name" "redis" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "at.labels" (dict "name" "redis" "root" $) | nindent 8 }}
    spec:
      {{- include "at.scheduling" (dict "root" $ "svc" .Values.redis "name" "redis") | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
{{- end }}
